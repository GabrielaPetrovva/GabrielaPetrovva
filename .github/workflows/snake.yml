name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3498db&color_dots=#ebedf0,#c6e2f5,#85c1e9,#3498db,#1b4f72
            dist/github-snake-dark.svg?color_snake=#5dade2&color_dots=#161b22,#1b4f72,#21618c,#3498db,#85c1e9&color_background=transparent

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
